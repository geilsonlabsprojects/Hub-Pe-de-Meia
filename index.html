<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Pé-de-Meia</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #10b981; /* Emerald 500 */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs (Type Module) -->
    <script type="module" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getRemoteConfig, fetchAndActivate, getValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-remote-config.js";

        // Configuração fornecida pelo usuário
        const firebaseConfig = {
            apiKey: "AIzaSyBLr84FdiPT-R1RIVV7Doo7lr16khInur8",
            authDomain: "aprovaenem-api.firebaseapp.com",
            projectId: "aprovaenem-api",
            storageBucket: "aprovaenem-api.firebasestorage.app",
            messagingSenderId: "717749759571",
            appId: "1:717749759571:web:9ef5eafee3e574799c60a6",
            measurementId: "G-HCY69TGJ9B"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const remoteConfig = getRemoteConfig(app);
        
        // Configurações do Remote Config
        remoteConfig.settings.minimumFetchIntervalMillis = 3600000; // 1 hora
        remoteConfig.defaultConfig = {
            "pe_de_meia": "" // Valor padrão caso não encontre
        };

        window.firebaseApp = { app, auth, remoteConfig, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, fetchAndActivate, getValue };
    </script>

    <!-- React App -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;

        // --- Componentes de UI ---
        const Card = ({ children, className = "" }) => (
            <div className={`glass-panel p-6 ${className}`}>{children}</div>
        );

        // --- Aba 1: Calculadora de Frequência ---
        const FrequenciaApp = () => {
            const [mes, setMes] = useState('Março');
            const [diasUteis, setDiasUteis] = useState(21);
            const [aulasPorDia, setAulasPorDia] = useState(5);
            const [diasSemAula, setDiasSemAula] = useState(0); // Feriados/Conselhos
            const [faltas, setFaltas] = useState(0); // Faltas do aluno em dias inteiros
            const [faltasAulas, setFaltasAulas] = useState(0); // Faltas do aluno em aulas avulsas
            const [resultado, setResultado] = useState(null);

            // Atualiza automaticamente uma estimativa de dias letivos ao mudar o mês
            useEffect(() => {
                const estimativaDias = {
                    'Fevereiro': 15, 'Março': 21, 'Abril': 22, 'Maio': 21,
                    'Junho': 20, 'Julho': 12, 'Agosto': 23, 'Setembro': 21,
                    'Outubro': 22, 'Novembro': 20, 'Dezembro': 12
                };
                if (estimativaDias[mes]) {
                    setDiasUteis(estimativaDias[mes]);
                    setDiasSemAula(0); // Reseta os feriados como conveniência
                }
            }, [mes]);

            const calcularFrequencia = () => {
                const diasDeAulaReais = diasUteis - diasSemAula;
                const totalAulasMes = diasDeAulaReais * aulasPorDia;
                // Soma as faltas de dias inteiros + faltas de aulas avulsas
                const totalFaltasAula = (faltas * aulasPorDia) + faltasAulas; 
                
                if (totalAulasMes <= 0) {
                    setResultado({ erro: "Número de dias letivos inválido." });
                    return;
                }

                const aulasAssistidas = totalAulasMes - totalFaltasAula;
                const porcentagem = (aulasAssistidas / totalAulasMes) * 100;

                setResultado({
                    porcentagem: porcentagem.toFixed(1),
                    aprovado: porcentagem >= 80,
                    totalAulas: totalAulasMes,
                    aulasAssistidas: aulasAssistidas
                });
            };

            return (
                <Card className="max-w-xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <i data-lucide="calculator" className="text-emerald-500"></i>
                        Calculadora de Frequência
                    </h2>
                    
                    <div className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Mês</label>
                                <select className="w-full p-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500"
                                    value={mes} onChange={e => setMes(e.target.value)}>
                                    {['Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Dias úteis no mês</label>
                                <input type="number" className="w-full p-2 border border-gray-300 rounded-lg" 
                                    value={diasUteis} onChange={e => setDiasUteis(Number(e.target.value))} min="1" max="31"/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Aulas por dia</label>
                                <input type="number" className="w-full p-2 border border-gray-300 rounded-lg" 
                                    value={aulasPorDia} onChange={e => setAulasPorDia(Number(e.target.value))} min="1" max="10"/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Dias s/ aula (Feriados)</label>
                                <input type="number" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500" 
                                    value={diasSemAula} onChange={e => setDiasSemAula(Number(e.target.value))} min="0" max="31"/>
                            </div>
                        </div>

                        <div className="pt-2 border-t border-gray-200">
                            <label className="block text-sm font-bold text-red-600 mb-1">Dias INTEIROS que você faltou</label>
                            <input type="number" className="w-full p-2 border border-red-300 rounded-lg focus:ring-red-500 focus:border-red-500" 
                                value={faltas} onChange={e => setFaltas(Number(e.target.value))} min="0" max="31"/>
                            <p className="text-xs text-gray-500 mt-1">Ex: Não foi para a escola em 2 dias = coloque 2.</p>
                        </div>

                        <div className="pt-1">
                            <label className="block text-sm font-bold text-orange-600 mb-1">AULAS AVULSAS que você faltou</label>
                            <input type="number" className="w-full p-2 border border-orange-300 rounded-lg focus:ring-orange-500 focus:border-orange-500" 
                                value={faltasAulas} onChange={e => setFaltasAulas(Number(e.target.value))} min="0" max="100"/>
                            <p className="text-xs text-gray-500 mt-1">Ex: Foi para a escola, mas matou/perdeu as 2 últimas aulas = coloque 2.</p>
                        </div>

                        <button onClick={calcularFrequencia} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4 shadow-md hover:shadow-lg">
                            Calcular Frequência
                        </button>

                        {resultado && !resultado.erro && (
                            <div className={`mt-6 p-4 rounded-lg border-2 ${resultado.aprovado ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}`}>
                                <h3 className={`text-xl font-bold text-center ${resultado.aprovado ? 'text-green-700' : 'text-red-700'}`}>
                                    {resultado.porcentagem}% de Frequência
                                </h3>
                                <p className="text-center text-sm mt-2 text-gray-600">
                                    {resultado.aprovado ? '✅ Parabéns! Você está dentro da meta de 80%.' : '❌ Cuidado! Você está abaixo dos 80% exigidos pelo programa.'}
                                </p>
                                <div className="mt-3 text-sm text-gray-700 flex justify-between px-4">
                                    <span>Total de aulas: <b>{resultado.totalAulas}</b></span>
                                    <span>Aulas assistidas: <b>{resultado.aulasAssistidas}</b></span>
                                </div>
                            </div>
                        )}
                        {resultado && resultado.erro && (
                            <div className="mt-4 p-3 bg-red-100 text-red-700 rounded-lg border border-red-200">{resultado.erro}</div>
                        )}
                    </div>

                    {/* Links Oficiais */}
                    <div className="mt-8 border-t border-gray-200 pt-6">
                        <h3 className="text-sm font-bold text-gray-700 mb-4 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="link" className="w-4 h-4 text-gray-400"></i> Links Oficiais & Consultas
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a href="https://aluno.seduc.ce.gov.br/app/frequencias" target="_blank" rel="noopener noreferrer" 
                               className="flex items-start gap-3 p-3 bg-white rounded-lg border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all group">
                                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                    <i data-lucide="laptop" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p className="font-bold text-gray-800 text-sm group-hover:text-blue-700">Aluno Online</p>
                                    <p className="text-xs text-gray-500 mt-0.5">Consulte as faltas lançadas oficialmente pelos professores.</p>
                                </div>
                            </a>
                            <a href="https://www.gov.br/mec/pt-br/pe-de-meia" target="_blank" rel="noopener noreferrer"
                               className="flex items-start gap-3 p-3 bg-white rounded-lg border border-gray-200 hover:border-emerald-400 hover:shadow-md transition-all group">
                                <div className="p-2 bg-emerald-50 text-emerald-600 rounded-lg group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                                    <i data-lucide="smartphone" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p className="font-bold text-gray-800 text-sm group-hover:text-emerald-700">Jornada do Estudante</p>
                                    <p className="text-xs text-gray-500 mt-0.5">App oficial para ver se você foi aprovado para receber no mês.</p>
                                </div>
                            </a>
                        </div>
                    </div>
                </Card>
            );
        };

        // --- Aba 2: Assistente IA de Pagamento ---
        const AssistenteIA = ({ user }) => {
            const [mesAniversario, setMesAniversario] = useState('Janeiro');
            const [mesConsulta, setMesConsulta] = useState('Março');
            const [respostaIA, setRespostaIA] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const consultarIA = async () => {
                if (!window.firebaseApp) return;
                setLoading(true);
                setError('');
                setRespostaIA('');

                try {
                    // 1. Buscar a chave da API no Remote Config
                    const rc = window.firebaseApp.remoteConfig;
                    await window.firebaseApp.fetchAndActivate(rc);
                    const chavesConfig = window.firebaseApp.getValue(rc, 'pe_de_meia').asString();
                    
                    if (!chavesConfig) {
                        throw new Error("Chave da IA não configurada no Firebase (Remote Config: pe_de_meia vazio).");
                    }

                    // Lógica para lidar com múltiplas chaves (ex: separadas por vírgula)
                    const chavesArray = chavesConfig.split(',').map(k => k.trim());
                    const apiKey = chavesArray[Math.floor(Math.random() * chavesArray.length)]; // Pega uma aleatória se houver mais de uma

                    // 2. Montar o Prompt para o Gemini
                    const promptText = `
                    Você é o assistente virtual do programa "Pé-de-Meia" do Governo Federal do Brasil.
                    O aluno nasceu em ${mesAniversario} e está perguntando sobre o pagamento referente ao mês escolar de ${mesConsulta}.
                    
                    Regras importantes que você deve considerar e avisar o aluno se aplicável:
                    - Os pagamentos de Janeiro e Fevereiro geralmente sofrem um adiantamento ou agrupamento por causa do início do ano letivo.
                    - Os pagamentos de Novembro e Dezembro também sofrem adiantamentos/agrupamentos devido ao fim do ano letivo e fechamento do calendário.
                    - O pagamento é feito conforme o mês de nascimento do aluno (escalonamento).
                    
                    Crie um cronograma simulado mostrando informações como se o sistema estivesse atualizando a cada 7 dias do mês para ele acompanhar.
                    Seja encorajador, use emojis, e formate em HTML leve (usando <b>, <ul>, <li>, <br>) para ficar bonito na tela. Responda apenas o necessário, sem enrolação.
                    `;

                    // 3. Chamar a API do Gemini
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Erro na API da IA: ${response.status}`);
                    }

                    const data = await response.json();
                    const textoGerado = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (textoGerado) {
                        setRespostaIA(textoGerado);
                    } else {
                        throw new Error("A IA não retornou uma resposta válida.");
                    }

                } catch (err) {
                    console.error(err);
                    setError(err.message || "Ocorreu um erro ao consultar a IA. Tente novamente mais tarde.");
                } finally {
                    setLoading(false);
                }
            };

            if (!user) {
                return (
                    <Card className="max-w-xl mx-auto text-center py-10">
                        <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="bot" size="32"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-2">Assistente IA de Pagamento</h2>
                        <p className="text-gray-600 mb-6">Para usar a Inteligência Artificial que calcula e prevê as datas exatas do seu pagamento, você precisa fazer login.</p>
                        <button onClick={window.loginGoogle} className="bg-white border-2 border-gray-200 text-gray-700 hover:bg-gray-50 font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center mx-auto gap-3 w-full sm:w-auto">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-5 h-5" alt="Google" />
                            Fazer Login com Google
                        </button>
                    </Card>
                );
            }

            return (
                <Card className="max-w-xl mx-auto">
                    <div className="flex justify-between items-start mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                            <i data-lucide="sparkles" className="text-blue-500"></i>
                            Previsão IA
                        </h2>
                        <div className="text-right">
                            <p className="text-xs text-gray-500">Logado como</p>
                            <p className="text-sm font-bold text-gray-700 truncate w-32">{user.displayName}</p>
                        </div>
                    </div>

                    <div className="space-y-4 mb-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Mês do seu Aniversário</label>
                                <select className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                    value={mesAniversario} onChange={e => setMesAniversario(e.target.value)}>
                                    {['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Mês que deseja consultar</label>
                                <select className="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                    value={mesConsulta} onChange={e => setMesConsulta(e.target.value)}>
                                    {['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <button 
                            onClick={consultarIA} 
                            disabled={loading}
                            className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                            {loading ? <div className="loader border-t-white w-6 h-6 border-2"></div> : 'Consultar Cronograma com IA'}
                        </button>
                    </div>

                    {error && (
                        <div className="p-4 bg-red-50 text-red-700 rounded-lg border border-red-200 text-sm">
                            <i data-lucide="alert-circle" className="inline mr-2 w-4 h-4"></i>
                            {error}
                        </div>
                    )}

                    {respostaIA && (
                        <div className="mt-4 p-5 bg-blue-50 rounded-lg border border-blue-100">
                            <h3 className="font-bold text-blue-800 mb-3 flex items-center gap-2">
                                <i data-lucide="bot" className="w-5 h-5"></i> Resposta da IA:
                            </h3>
                            <div className="text-gray-700 text-sm leading-relaxed prose prose-blue" dangerouslySetInnerHTML={{ __html: respostaIA.replace(/```html/g, '').replace(/```/g, '') }} />
                        </div>
                    )}
                </Card>
            );
        };

        // --- Aba 3: Extras (Simulador) ---
        const ExtrasApp = () => {
            const [meses, setMeses] = useState(10);
            const valorMensal = 200; // Valor base do programa
            const valorConclusao = 1000; // Bônus anual de conclusão

            const totalMensalidades = meses * valorMensal;
            const anosConcluidos = Math.floor(meses / 10); // Aproximadamente 10 meses letivos por ano
            const totalBonus = anosConcluidos * valorConclusao;
            const totalGeral = totalMensalidades + totalBonus;

            return (
                <Card className="max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                        <i data-lucide="piggy-bank" className="text-yellow-500"></i>
                        Simulador Poupança
                    </h2>
                    <p className="text-gray-600 text-sm mb-6">Veja quanto você pode acumular mantendo sua frequência perfeita.</p>

                    <div className="mb-6">
                        <label className="block text-sm font-medium text-gray-700 mb-2">Meses no programa (Frequência > 80%)</label>
                        <input type="range" min="1" max="30" value={meses} onChange={e => setMeses(Number(e.target.value))} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-yellow-500"/>
                        <div className="text-center mt-2 font-bold text-gray-700">{meses} meses ({Math.floor(meses/10)} anos completos)</div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 text-center">
                        <div className="p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <p className="text-xs text-gray-500 uppercase tracking-wide">Mensalidades (R$ 200)</p>
                            <p className="text-xl font-bold text-gray-800 mt-1">R$ {totalMensalidades.toLocaleString('pt-BR')}</p>
                        </div>
                        <div className="p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <p className="text-xs text-gray-500 uppercase tracking-wide">Bônus Anual (R$ 1000)</p>
                            <p className="text-xl font-bold text-gray-800 mt-1">R$ {totalBonus.toLocaleString('pt-BR')}</p>
                        </div>
                    </div>

                    <div className="mt-4 p-5 bg-gradient-to-r from-yellow-400 to-yellow-500 rounded-lg text-white text-center shadow-md">
                        <p className="text-sm font-medium opacity-90 uppercase tracking-wider mb-1">Total Acumulado Estimado</p>
                        <h3 className="text-4xl font-extrabold">R$ {totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h3>
                    </div>
                </Card>
            );
        };

        // --- App Principal ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoaded, setAuthLoaded] = useState(false);
            const [activeTab, setActiveTab] = useState('frequencia');

            useEffect(() => {
                // Aguardar o script do Firebase carregar
                const checkFirebase = setInterval(() => {
                    if (window.firebaseApp) {
                        clearInterval(checkFirebase);
                        
                        // Set up Auth Listener
                        window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (currentUser) => {
                            setUser(currentUser);
                            setAuthLoaded(true);
                        });

                        // Configurar funções globais para botões
                        window.loginGoogle = async () => {
                            try {
                                const provider = new window.firebaseApp.GoogleAuthProvider();
                                await window.firebaseApp.signInWithPopup(window.firebaseApp.auth, provider);
                            } catch (error) {
                                console.error("Erro no login", error);
                                alert("Erro ao fazer login com Google.");
                            }
                        };

                        window.logout = async () => {
                            await window.firebaseApp.signOut(window.firebaseApp.auth);
                        };
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            // Re-render Lucide icons when tab changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            if (!authLoaded) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="bg-emerald-600 text-white shadow-lg">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i data-lucide="graduation-cap" className="w-8 h-8"></i>
                                <h1 className="text-xl font-bold tracking-tight">Hub Pé-de-Meia</h1>
                            </div>
                            <div>
                                {user ? (
                                    <button onClick={window.logout} className="text-sm bg-emerald-700 hover:bg-emerald-800 px-4 py-2 rounded-full transition">Sair</button>
                                ) : (
                                    <button onClick={window.loginGoogle} className="text-sm bg-white text-emerald-600 font-bold hover:bg-gray-100 px-4 py-2 rounded-full transition">Entrar</button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navegação Tabs */}
                    <div className="max-w-4xl mx-auto px-4 mt-6 mb-8">
                        <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                            <button onClick={() => setActiveTab('frequencia')} 
                                className={`flex items-center gap-2 px-5 py-3 rounded-full font-medium whitespace-nowrap transition-all ${activeTab === 'frequencia' ? 'bg-emerald-500 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'}`}>
                                <i data-lucide="calendar-check" className="w-4 h-4"></i> Frequência
                            </button>
                            <button onClick={() => setActiveTab('pagamento')} 
                                className={`flex items-center gap-2 px-5 py-3 rounded-full font-medium whitespace-nowrap transition-all ${activeTab === 'pagamento' ? 'bg-blue-500 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'}`}>
                                <i data-lucide="calendar-clock" className="w-4 h-4"></i> Previsão IA
                            </button>
                            <button onClick={() => setActiveTab('extras')} 
                                className={`flex items-center gap-2 px-5 py-3 rounded-full font-medium whitespace-nowrap transition-all ${activeTab === 'extras' ? 'bg-yellow-500 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-50 border border-gray-200'}`}>
                                <i data-lucide="piggy-bank" className="w-4 h-4"></i> Simulador
                            </button>
                        </div>
                    </div>

                    {/* Área de Conteúdo */}
                    <main className="max-w-4xl mx-auto px-4">
                        {activeTab === 'frequencia' && <FrequenciaApp />}
                        {activeTab === 'pagamento' && <AssistenteIA user={user} />}
                        {activeTab === 'extras' && <ExtrasApp />}
                    </main>

                    {/* Footer decorativo */}
                    <div className="text-center text-gray-400 text-xs mt-12 max-w-sm mx-auto">
                        Ferramenta independente para auxiliar estudantes no acompanhamento do programa governamental.
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
