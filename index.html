<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getRemoteConfig, fetchAndActivate, getString } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-remote-config.js";

        const userConfig = {
            apiKey: "AIzaSyBLr84FdiPT-R1RIVV7Doo7lr16khInur8",
            authDomain: "aprovaenem-api.firebaseapp.com",
            projectId: "aprovaenem-api",
            storageBucket: "aprovaenem-api.firebasestorage.app",
            messagingSenderId: "717749759571",
            appId: "1:717749759571:web:9ef5eafee3e574799c60a6",
            measurementId: "G-HCY69TGJ9B"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userConfig;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const remoteConfig = getRemoteConfig(app);
        
        // Configura intervalo de fetch do Remote Config
        remoteConfig.settings.minimumFetchIntervalMillis = 3600000; // 1 hora

        window.firebaseApp = { app, auth, remoteConfig, fetchAndActivate, getString, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged };
    </script>

    <!-- React App -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Função para extrair texto puro do HTML (usado no histórico) ---
        const stripHtml = (html) => {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        };

        // --- Sanitiza HTML permitindo apenas tags simples de formatação ---
        const sanitizeHtml = (html = '') => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = String(html);

            const allowedTags = new Set(['B', 'BR', 'STRONG', 'EM', 'U']);
            const nodes = wrapper.querySelectorAll('*');

            nodes.forEach((node) => {
                if (!allowedTags.has(node.tagName)) {
                    const textNode = document.createTextNode(node.textContent || '');
                    node.replaceWith(textNode);
                    return;
                }

                [...node.attributes].forEach((attr) => node.removeAttribute(attr.name));
            });

            return wrapper.innerHTML;
        };

        // --- Hook Customizado para Salvar no Cache (LocalStorage) ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error("Erro ao salvar no LocalStorage:", error);
                }
            };
            return [storedValue, setValue];
        }

        const Card = ({ children, className = "" }) => (
            <div className={`glass-panel p-6 sm:p-8 animate-fade-in ${className}`}>
                {children}
            </div>
        );

        // --- Aba 1: Calculadora de Frequência ---
        const FrequenciaApp = () => {
            const [mes, setMes] = useLocalStorage('hub_freq_mes', 'Março');
            const [diasUteis, setDiasUteis] = useLocalStorage('hub_freq_diasUteis', 21);
            const [aulasPorDia, setAulasPorDia] = useLocalStorage('hub_freq_aulasPorDia', 5);
            const [diasSemAula, setDiasSemAula] = useLocalStorage('hub_freq_diasSemAula', 0); 
            const [faltas, setFaltas] = useLocalStorage('hub_freq_faltas', 0); 
            const [faltasAulas, setFaltasAulas] = useLocalStorage('hub_freq_faltasAulas', 0); 
            const [resultado, setResultado] = useState(null);

            const calcularFrequencia = () => {
                const diasDeAulaReais = diasUteis - diasSemAula;
                const totalAulasMes = diasDeAulaReais * aulasPorDia;
                const totalFaltasAula = (faltas * aulasPorDia) + faltasAulas; 
                
                if (totalAulasMes <= 0) {
                    setResultado({ erro: "Verifique os dias letivos. O número total de aulas está inválido." });
                    return;
                }

                const aulasAssistidas = totalAulasMes - totalFaltasAula;
                const porcentagem = (aulasAssistidas / totalAulasMes) * 100;

                setResultado({
                    porcentagem: porcentagem.toFixed(1),
                    aprovado: porcentagem >= 80,
                    totalAulas: totalAulasMes,
                    aulasAssistidas: aulasAssistidas
                });
            };

            return (
                <Card className="max-w-2xl mx-auto">
                    <h2 className="text-2xl font-extrabold text-blue-900 mb-6 flex items-center gap-3">
                        <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="calculator"></i></div>
                        Calculadora de Frequência
                    </h2>
                    
                    <div className="space-y-5">
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div>
                                <label className="block text-sm font-semibold text-blue-900 mb-1.5">Mês de Referência</label>
                                <select className="w-full p-2.5 border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm"
                                    value={mes} onChange={e => setMes(e.target.value)}>
                                    {['Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-blue-900 mb-1.5">Dias úteis no mês</label>
                                <input type="number" className="w-full p-2.5 border border-blue-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 shadow-sm" 
                                    value={diasUteis} onChange={e => setDiasUteis(Number(e.target.value))} min="1" max="31"/>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-blue-900 mb-1.5">Aulas por dia</label>
                                <input type="number" className="w-full p-2.5 border border-blue-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 shadow-sm" 
                                    value={aulasPorDia} onChange={e => setAulasPorDia(Number(e.target.value))} min="1" max="10"/>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-blue-900 mb-1.5">Dias s/ aula (Feriados)</label>
                                <input type="number" className="w-full p-2.5 border border-blue-200 rounded-xl focus:ring-2 focus:ring-blue-500 bg-white shadow-sm" 
                                    value={diasSemAula} onChange={e => setDiasSemAula(Number(e.target.value))} min="0" max="31"/>
                            </div>
                        </div>

                        <div className="p-4 bg-red-50/50 rounded-xl border border-red-100">
                            <label className="block text-sm font-bold text-red-700 mb-1.5">Dias INTEIROS que você faltou</label>
                            <input type="number" className="w-full p-2.5 border border-red-200 bg-white rounded-xl focus:ring-2 focus:ring-red-500 shadow-sm" 
                                value={faltas} onChange={e => setFaltas(Number(e.target.value))} min="0" max="31"/>
                        </div>

                        <div className="p-4 bg-orange-50/50 rounded-xl border border-orange-100">
                            <label className="block text-sm font-bold text-orange-700 mb-1.5">AULAS AVULSAS que você faltou</label>
                            <input type="number" className="w-full p-2.5 border border-orange-200 bg-white rounded-xl focus:ring-2 focus:ring-orange-500 shadow-sm" 
                                value={faltasAulas} onChange={e => setFaltasAulas(Number(e.target.value))} min="0" max="100"/>
                        </div>

                        <button onClick={calcularFrequencia} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg mt-6">
                            Calcular Minha Frequência
                        </button>

                        {resultado && !resultado.erro && (
                            <div className={`mt-8 p-6 rounded-xl border-2 animate-fade-in ${resultado.aprovado ? 'border-emerald-400 bg-emerald-50' : 'border-red-400 bg-red-50'}`}>
                                <h3 className={`text-3xl font-black text-center mb-2 ${resultado.aprovado ? 'text-emerald-700' : 'text-red-700'}`}>
                                    {resultado.porcentagem}%
                                </h3>
                                <p className="text-center text-sm mb-4 font-bold">
                                    {resultado.aprovado ? 
                                        <span className="text-emerald-600 flex items-center justify-center gap-2"><i data-lucide="check-circle"></i> Dentro da meta!</span> : 
                                        <span className="text-red-600 flex items-center justify-center gap-2"><i data-lucide="alert-triangle"></i> Risco de perder o benefício.</span>}
                                </p>
                            </div>
                        )}
                    </div>
                </Card>
            );
        };

        // --- Aba 2: Assistente IA de Pagamento / Datas ---
        const AssistenteIA = ({ user }) => {
            const [mesAniversario, setMesAniversario] = useLocalStorage('hub_ia_aniversario', 'Janeiro');
            const [mesConsulta, setMesConsulta] = useLocalStorage('hub_ia_consulta', 'Março');
            const [historico, setHistorico] = useLocalStorage('hub_ia_historico', []);
            const [expandedHist, setExpandedHist] = useState(null);

            const [respostaIA, setRespostaIA] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [expandedHist, historico, respostaIA]);

            const limparHistorico = () => {
                if(window.confirm("Deseja apagar todo o histórico de pesquisas?")) {
                    setHistorico([]);
                }
            };

            const toggleHistorico = (id) => {
                setExpandedHist(expandedHist === id ? null : id);
            };

            const consultarIA = async () => {
                setLoading(true);
                setError('');
                setRespostaIA('');

                try {
                    let apiKey = "";

                    // 1. Busca chave no Remote Config
                    try {
                        if (window.firebaseApp?.remoteConfig) {
                            await window.firebaseApp.fetchAndActivate(window.firebaseApp.remoteConfig);
                            const chavesStr = window.firebaseApp.getString(window.firebaseApp.remoteConfig, 'pe_de_meia');
                            if (chavesStr) {
                                let chavesAPI = [];
                                try {
                                    const parsed = JSON.parse(chavesStr);
                                    chavesAPI = Array.isArray(parsed) ? parsed : [String(parsed)];
                                } catch {
                                    chavesAPI = [chavesStr];
                                }
                                apiKey = chavesAPI.length > 0
                                    ? chavesAPI[Math.floor(Math.random() * chavesAPI.length)]
                                    : "";
                            }
                        }
                    } catch (rcError) {
                        console.warn("Falha ao carregar Remote Config:", rcError);
                    }

                    if (!apiKey || apiKey.trim() === "") {
                        throw new Error("Configuração de sistema pendente (API Key ausente).");
                    }

                    const promptText = `
Você é um assistente virtual EXTREMAMENTE PRECISO especializado nas DATAS OFICIAIS de pagamento do programa "Pé-de-Meia" do Governo Federal.

ATENÇÃO MÁXIMA:
- Você NÃO PODE criar, estimar, deduzir ou inferir datas.
- Você NÃO PODE usar tabelas, padrões, listas ou regras internas.
- Você NÃO PODE assumir datas com base em mês de nascimento.
- Você NÃO PODE inventar pagamentos.
- Se não tiver a informação EXATA e OFICIAL, você deve dizer que não sabe.

DADOS:
- Mês de nascimento do aluno: ${mesAniversario}
- Parcela referente ao mês letivo: ${mesConsulta}

PROCESSO OBRIGATÓRIO:
1. Verifique se existe informação oficial EXATA para essa situação.
2. Se NÃO tiver certeza absoluta da data:
   - Informe que não é possível determinar a data com segurança.
3. Se tiver certeza absoluta:
   - Informe a data EXATA, sem alterar nada.

FORMATO DA RESPOSTA:
- Use HTML simples (<b>, <br>)
- Seja direto
- NÃO use blocos de código

SAÍDA QUANDO HÁ DATA CONFIRMADA:
<b>Data de pagamento:</b> DIA XX<br>
<b>Referente ao mês:</b> ${mesConsulta}

SAÍDA QUANDO NÃO É POSSÍVEL DETERMINAR:
<b>Atenção:</b> Não foi possível identificar a data exata de pagamento para essa situação com segurança.

REGRA FINAL:
- Nunca invente datas.
- Nunca use padrões ocultos.
- Nunca arrisque um dia.
`;

                    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Erro na API (${response.status})`);
                    }

                    const data = await response.json();
                    if (data.error) {
                        throw new Error(data.error.message || "Erro na resposta da IA.");
                    }
                    const textoGerado = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (textoGerado) {
                        const respostaFormatada = textoGerado.replace(/```html/g, '').replace(/```/g, '');
                        setRespostaIA(respostaFormatada);
                        
                        // Salvar no histórico
                        const novaPesquisa = {
                            id: Date.now(),
                            data: new Date().toLocaleDateString('pt-BR') + ' às ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                            aniversario: mesAniversario,
                            consulta: mesConsulta,
                            resposta: respostaFormatada
                        };
                        setHistorico(prev => [novaPesquisa, ...prev].slice(0, 10));
                    } else {
                        throw new Error("Resposta em branco.");
                    }

                } catch (err) {
                    console.error(err);
                    setError(
                        err.message?.includes("API Key")
                            ? "Erro de autenticação na API"
                            : "Erro ao consultar datas. Tente novamente em instantes."
                    );
                } finally {
                    setLoading(false);
                }
            };

            if (!user) {
                return (
                    <Card className="max-w-xl mx-auto text-center py-12">
                        <div className="w-20 h-20 bg-blue-100/80 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border border-blue-200">
                            <i data-lucide="calendar-search" size="40"></i>
                        </div>
                        <h2 className="text-3xl font-black text-blue-900 mb-3 tracking-tight">Datas Inteligentes</h2>
                        <p className="text-gray-600 mb-8 font-medium px-4">Utilize nossa IA para saber o dia exato em que seu pagamento cairá, baseado no seu mês de nascimento.</p>
                        
                        <button onClick={window.loginGoogle} className="bg-white border border-gray-200 text-gray-800 hover:bg-gray-50 hover:border-blue-300 hover:shadow-lg font-bold py-3.5 px-8 rounded-xl transition-all flex items-center justify-center mx-auto gap-3 w-full sm:w-auto transform hover:-translate-y-0.5">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-6 h-6" alt="Google" />
                            Continuar com Google
                        </button>
                    </Card>
                );
            }

            return (
                <Card className="max-w-2xl mx-auto">
                    <div className="flex justify-between items-center mb-6 border-b border-blue-100/50 pb-5">
                        <h2 className="text-2xl font-extrabold text-blue-900 flex items-center gap-3">
                            <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="sparkles"></i></div>
                            Previsão de Pagamento
                        </h2>
                    </div>

                    <div className="space-y-5 mb-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="bg-white p-3 rounded-xl border border-blue-100 shadow-sm">
                                <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide">Mês do seu Aniversário</label>
                                <select className="w-full p-2.5 bg-gray-50 border-none rounded-lg focus:ring-2 focus:ring-blue-500 font-bold text-blue-900"
                                    value={mesAniversario} onChange={e => setMesAniversario(e.target.value)}>
                                    {['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-blue-100 shadow-sm">
                                <label className="block text-xs font-bold text-gray-500 mb-1.5 uppercase tracking-wide">Mês Letivo da Parcela</label>
                                <select className="w-full p-2.5 bg-gray-50 border-none rounded-lg focus:ring-2 focus:ring-blue-500 font-bold text-blue-900"
                                    value={mesConsulta} onChange={e => setMesConsulta(e.target.value)}>
                                    {['Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <button 
                            onClick={consultarIA} 
                            disabled={loading}
                            className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:opacity-70 text-white font-bold py-4 px-4 rounded-xl transition-all flex justify-center items-center gap-2 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                            {loading ? <div className="loader"></div> : <><i data-lucide="bot" className="w-5 h-5"></i> Consultar Inteligência Artificial</>}
                        </button>
                    </div>

                    {error && (
                        <div className="p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 text-sm font-bold animate-fade-in flex items-center gap-2">
                            <i data-lucide="alert-octagon" className="w-5 h-5"></i>
                            {error}
                        </div>
                    )}

                    {respostaIA && !error && (
                        <div className="mt-2 p-6 bg-white rounded-2xl border border-indigo-100 shadow-[0_4px_20px_-4px_rgba(79,70,229,0.15)] animate-fade-in relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                            <h3 className="font-extrabold text-indigo-900 mb-4 flex items-center gap-2 text-lg">
                                <i data-lucide="check-circle-2" className="w-6 h-6 text-indigo-500"></i> Resultado Oficial:
                            </h3>
                            <div className="text-gray-700 text-[15px] leading-relaxed" dangerouslySetInnerHTML={{ __html: sanitizeHtml(respostaIA) }} />
                        </div>
                    )}

                    {/* Histórico Sanfona (Compacto) */}
                    {historico.length > 0 && (
                        <div className="mt-10 pt-6">
                            <div className="flex justify-between items-end mb-4 px-1">
                                <h3 className="text-sm font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="clock" className="w-4 h-4"></i> Histórico
                                </h3>
                                <button onClick={limparHistorico} className="text-xs text-red-500 hover:text-white hover:bg-red-500 font-bold border border-red-200 px-3 py-1.5 rounded-full transition-colors">Limpar Histórico</button>
                            </div>
                            
                            <div className="space-y-3">
                                {historico.map((item) => {
                                    const isExpanded = expandedHist === item.id;
                                    const resumoTexto = stripHtml(item.resposta).substring(0, 65) + "...";

                                    return (
                                        <div key={item.id} className="bg-white rounded-xl border border-gray-100 shadow-sm transition-all overflow-hidden">
                                            <div 
                                                onClick={() => toggleHistorico(item.id)}
                                                className="p-4 cursor-pointer hover:bg-gray-50 flex flex-col gap-2"
                                            >
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="inline-block bg-blue-50 text-blue-700 text-[10px] font-black uppercase px-2 py-1 rounded-md mb-1">Nascido em {item.aniversario}</span>
                                                        <p className="text-sm font-bold text-gray-800">Parcela de {item.consulta}</p>
                                                    </div>
                                                    <div className="flex flex-col items-end gap-1">
                                                        <span className="text-[10px] text-gray-400 font-medium">{item.data}</span>
                                                        <i data-lucide={isExpanded ? "chevron-up" : "chevron-down"} className="w-4 h-4 text-gray-400"></i>
                                                    </div>
                                                </div>
                                                
                                                {/* Se estiver fechado, mostra 3 pontinhos */}
                                                {!isExpanded && (
                                                    <p className="text-xs text-gray-500 font-medium italic mt-1">
                                                        {resumoTexto}
                                                    </p>
                                                )}
                                            </div>

                                            {/* Se estiver aberto, mostra tudo */}
                                            {isExpanded && (
                                                <div className="p-4 bg-gray-50/80 border-t border-gray-100 text-sm text-gray-700 animate-fade-in" 
                                                     dangerouslySetInnerHTML={{ __html: sanitizeHtml(item.resposta) }}>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </Card>
            );
        };

        // --- Aba 3: Extras (Simulador) ---
        const ExtrasApp = () => {
            const [meses, setMeses] = useLocalStorage('hub_simulador_meses', 10);
            const totalMensalidades = meses * 200;
            const anosConcluidos = Math.floor(meses / 10); 
            const totalBonus = anosConcluidos * 1000;
            const totalGeral = totalMensalidades + totalBonus;

            return (
                <Card className="max-w-2xl mx-auto">
                    <h2 className="text-2xl font-extrabold text-emerald-900 mb-2 flex items-center gap-3">
                        <div className="bg-emerald-100 p-2 rounded-lg text-emerald-600"><i data-lucide="piggy-bank"></i></div>
                        Simulador de Poupança
                    </h2>
                    <p className="text-emerald-700/80 text-sm mb-8 font-medium">Veja quanto você pode acumular mantendo a frequência acima de 80%.</p>

                    <div className="mb-8 bg-white p-6 rounded-2xl border border-emerald-100 shadow-sm">
                        <div className="flex justify-between mb-4">
                            <label className="text-sm font-bold text-emerald-900">Tempo de Estudo</label>
                            <span className="text-sm font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">{meses} meses</span>
                        </div>
                        <input type="range" min="1" max="30" value={meses} onChange={e => setMeses(Number(e.target.value))} className="w-full h-3 bg-emerald-100 rounded-full appearance-none cursor-pointer accent-emerald-600 outline-none"/>
                        <div className="text-center mt-3 text-xs font-bold text-gray-400 uppercase tracking-widest">{Math.floor(meses/10)} Anos Letivos Completos</div>
                    </div>

                    <div className="mt-4 p-6 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-2xl text-white text-center shadow-xl">
                        <p className="text-xs font-bold opacity-80 uppercase tracking-widest mb-1">Total Acumulado na Poupança</p>
                        <h3 className="text-5xl font-black">R$ {totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h3>
                    </div>
                </Card>
            );
        };

        // --- Aba 4: Dúvidas (Sanfona) ---
        const DuvidasApp = () => {
            const [openFaq, setOpenFaq] = useState(null);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [openFaq]);

            const faqData = [
                {
                    q: "Quem tem direito ao programa Pé-de-Meia?",
                    a: "Estudantes ativos no ensino médio de redes públicas, entre 15 e 24 anos, com as famílias obrigatoriamente inscritas no Cadastro Único (CadÚnico) e beneficiárias do Bolsa Família."
                },
                {
                    q: "O que acontece se eu faltar com Atestado Médico?",
                    a: "Faltas amparadas por atestado médico e validadas pela coordenação da sua escola são ABONADAS no sistema. Elas não diminuem sua frequência e você não perde o benefício, desde que entregues no prazo da escola."
                },
                {
                    q: "Reprovei de ano. Perco o Pé-de-Meia?",
                    a: "Se você reprovar, perde o direito à parcela anual (bônus de R$ 1.000 da aprovação), mas se continuar matriculado e frequentando as aulas no ano seguinte, pode voltar a receber as mensalidades normais."
                },
                {
                    q: "Como saco o dinheiro?",
                    a: "O dinheiro cai automaticamente em uma conta digital no aplicativo Caixa Tem, aberta no seu nome. Você pode usar o app para pagar contas, fazer PIX ou sacar no caixa eletrônico."
                },
                {
                    q: "Posso receber o bônus do ENEM sem fazer a prova?",
                    a: "Não. O bônus extra de R$ 200 é pago EXCLUSIVAMENTE para os alunos do 3º ano do ensino médio que comparecerem aos dois dias de prova do ENEM."
                },
                {
                    q: "Como a IA consegue achar minha data exata?",
                    a: "Ela consulta uma Regra de Ouro baseada no escalonamento oficial do Caixa Tem e nos repasses do MEC, travando os dias para não cometer erros."
                }
            ];

            return (
                <Card className="max-w-2xl mx-auto">
                    <h2 className="text-2xl font-extrabold text-blue-900 mb-8 flex items-center gap-3">
                        <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="help-circle"></i></div>
                        Dúvidas Frequentes
                    </h2>
                    
                    <div className="space-y-3">
                        {faqData.map((item, idx) => {
                            const isOpen = openFaq === idx;
                            return (
                                <div key={idx} className="bg-white rounded-2xl border border-blue-100/60 shadow-sm overflow-hidden transition-all">
                                    <button 
                                        onClick={() => setOpenFaq(isOpen ? null : idx)}
                                        className="w-full text-left p-5 font-bold text-blue-900 flex justify-between items-center hover:bg-blue-50/50 transition-colors"
                                    >
                                        <span className="pr-4">{item.q}</span>
                                        <i data-lucide={isOpen ? "chevron-up" : "chevron-down"} className="w-5 h-5 text-blue-500 flex-shrink-0"></i>
                                    </button>
                                    
                                    {isOpen && (
                                        <div className="p-5 pt-0 text-gray-600 text-sm leading-relaxed border-t border-blue-50 bg-blue-50/20 animate-fade-in">
                                            {item.a}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </Card>
            );
        };

        // --- App Principal ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoaded, setAuthLoaded] = useState(false);
            const [activeTab, setActiveTab] = useLocalStorage('hub_activeTab', 'frequencia');
            const [authError, setAuthError] = useState('');

            useEffect(() => {
                window.loginGoogle = () => {};
                window.logout = () => {};

                const failSafeTimeout = setTimeout(() => {
                    if (!window.firebaseApp) {
                        setAuthError("Falha ao inicializar autenticação. Recarregue a página.");
                        setAuthLoaded(true);
                    }
                }, 5000);

                const checkFirebase = setInterval(() => {
                    if (window.firebaseApp) {
                        clearInterval(checkFirebase);
                        clearTimeout(failSafeTimeout);
                        
                        window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (currentUser) => {
                            setUser(currentUser);
                            setAuthLoaded(true);
                        });

                        window.loginGoogle = async () => {
                            try {
                                const provider = new window.firebaseApp.GoogleAuthProvider();
                                await window.firebaseApp.signInWithPopup(window.firebaseApp.auth, provider);
                            } catch (error) {
                                console.error("Erro no login", error);
                            }
                        };

                        window.logout = async () => {
                            await window.firebaseApp.signOut(window.firebaseApp.auth);
                        };
                    }
                }, 100);

                return () => {
                    clearInterval(checkFirebase);
                    clearTimeout(failSafeTimeout);
                };
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [activeTab, authLoaded, user]);

            if (!authLoaded) return <div className="min-h-screen flex items-center justify-center bg-[#f0f4f8]"><div className="loader !border-blue-200 !border-t-blue-600 w-12 h-12 border-4"></div></div>;

            return (
                <div className="min-h-screen pb-20 flex flex-col font-sans text-gray-800">
                    <header className="bg-gradient-to-r from-blue-800 to-blue-600 text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 py-3 sm:py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-sm">
                                    <i data-lucide="graduation-cap" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="text-lg sm:text-xl font-black tracking-tight leading-none">Pé-de-Meia</h1>
                                    <span className="text-[10px] font-bold tracking-widest uppercase text-blue-200">Hub do Estudante</span>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 sm:gap-4">
                                {user ? (
                                    <div className="flex items-center gap-3 bg-white/10 pl-4 pr-1.5 py-1.5 rounded-full border border-white/10 backdrop-blur-sm">
                                        <div className="hidden sm:block text-right">
                                            <p className="text-[9px] text-blue-200 uppercase tracking-widest font-black leading-none mb-0.5">Aluno</p>
                                            <p className="text-sm font-bold truncate max-w-[100px] leading-none">{(user.displayName || user.email || "Aluno").split(' ')[0]}</p>
                                        </div>
                                        <img src={user.photoURL} referrerPolicy="no-referrer" alt="Avatar" className="w-8 h-8 rounded-full border-2 border-blue-300 shadow-sm" />
                                        <button onClick={window.logout} title="Sair" className="text-white/80 hover:text-white hover:bg-red-500 p-1.5 rounded-full transition-all">
                                            <i data-lucide="log-out" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={window.loginGoogle} className="text-sm bg-white text-blue-700 font-extrabold hover:bg-blue-50 px-6 py-2.5 rounded-full transition-all">
                                        Fazer Login
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    <div className="max-w-4xl mx-auto px-4 mt-8 mb-8 w-full">
                        {authError && (
                            <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200 font-semibold">
                                {authError}
                            </div>
                        )}
                        <div className="flex gap-2.5 overflow-x-auto pb-4 scrollbar-hide snap-x">
                            {[
                                { id: 'frequencia', icon: 'calculator', label: 'Frequência' },
                                { id: 'pagamento', icon: 'calendar-search', label: 'Datas IA' },
                                { id: 'extras', icon: 'piggy-bank', label: 'Simulador' },
                                { id: 'duvidas', icon: 'help-circle', label: 'Dúvidas' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                                    className={`snap-start flex items-center gap-2 px-6 py-3 rounded-xl font-bold whitespace-nowrap transition-all text-sm border-2 ${activeTab === tab.id ? 'bg-blue-600 border-blue-600 text-white shadow-[0_4px_15px_-3px_rgba(37,99,235,0.4)] transform -translate-y-0.5' : 'bg-white text-blue-600 border-blue-100 hover:border-blue-300 hover:bg-blue-50/50 shadow-sm'}`}>
                                    <i data-lucide={tab.icon} className="w-4 h-4"></i> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="max-w-4xl mx-auto px-4 flex-grow w-full">
                        {activeTab === 'frequencia' && <FrequenciaApp />}
                        {activeTab === 'pagamento' && <AssistenteIA user={user} />}
                        {activeTab === 'extras' && <ExtrasApp />}
                        {activeTab === 'duvidas' && <DuvidasApp />}
                    </main>

                    <footer className="mt-12 bg-white/60 backdrop-blur-md border-t border-gray-200/60 py-5 px-4 w-full text-center">
                        <div className="max-w-3xl mx-auto">
                            <p className="text-xs text-gray-500 font-bold flex items-center justify-center gap-1.5 flex-wrap">
                                <i data-lucide="info" className="w-4 h-4 text-gray-400"></i> Ferramenta INDEPENDENTE. Não é um aplicativo oficial do Governo Federal.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
