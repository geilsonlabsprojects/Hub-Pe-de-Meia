<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/Vcf66MxX/Chat-GPT-Image-22-de-mar-de-2026-15-55-23.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/Vcf66MxX/Chat-GPT-Image-22-de-mar-de-2026-15-55-23.png">
    <title>Hub Pé-de-Meia</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Hub Pé-de-Meia","short_name":"Pé-de-Meia","display":"standalone","background_color":"#f3f4f6","theme_color":"#1e3a8a","icons":[{"src":"https://www.svgrepo.com/show/475656/google-color.svg","sizes":"192x192","type":"image/png"}]}' />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f4f8; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }
        /* Loader */
        .loader {
            border: 4px solid #e0e7ff;
            border-top: 4px solid #2563eb; /* Blue 600 */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Hide scrollbar for tabs */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Fallback robusto para suportar seu ambiente local e o ambiente do Canvas
        const userConfig = {
            apiKey: "AIzaSyBLr84FdiPT-R1RIVV7Doo7lr16khInur8",
            authDomain: "aprovaenem-api.firebaseapp.com",
            projectId: "aprovaenem-api",
            storageBucket: "aprovaenem-api.firebasestorage.app",
            messagingSenderId: "717749759571",
            appId: "1:717749759571:web:9ef5eafee3e574799c60a6",
            measurementId: "G-HCY69TGJ9B"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userConfig;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.firebaseApp = { app, auth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged };
    </script>

    <!-- React App -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;

        // --- Componentes de UI ---
        const Card = ({ children, className = "" }) => (
            <div className={`glass-panel p-6 ${className}`}>{children}</div>
        );

        // --- Aba 1: Calculadora de Frequência ---
        const FrequenciaApp = () => {
            const [mes, setMes] = useState('Março');
            const [diasUteis, setDiasUteis] = useState(21);
            const [aulasPorDia, setAulasPorDia] = useState(5);
            const [diasSemAula, setDiasSemAula] = useState(0); 
            const [faltas, setFaltas] = useState(0); 
            const [faltasAulas, setFaltasAulas] = useState(0); 
            const [resultado, setResultado] = useState(null);

            useEffect(() => {
                const estimativaDias = {
                    'Fevereiro': 15, 'Março': 21, 'Abril': 22, 'Maio': 21,
                    'Junho': 20, 'Julho': 12, 'Agosto': 23, 'Setembro': 21,
                    'Outubro': 22, 'Novembro': 20, 'Dezembro': 12
                };
                if (estimativaDias[mes]) {
                    setDiasUteis(estimativaDias[mes]);
                    setDiasSemAula(0);
                }
            }, [mes]);

            const calcularFrequencia = () => {
                const diasDeAulaReais = diasUteis - diasSemAula;
                const totalAulasMes = diasDeAulaReais * aulasPorDia;
                const totalFaltasAula = (faltas * aulasPorDia) + faltasAulas; 
                
                if (totalAulasMes <= 0) {
                    setResultado({ erro: "Número de dias letivos inválido." });
                    return;
                }

                const aulasAssistidas = totalAulasMes - totalFaltasAula;
                const porcentagem = (aulasAssistidas / totalAulasMes) * 100;

                setResultado({
                    porcentagem: porcentagem.toFixed(1),
                    aprovado: porcentagem >= 80,
                    totalAulas: totalAulasMes,
                    aulasAssistidas: aulasAssistidas
                });
            };

            return (
                <Card className="max-w-xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold text-blue-900 mb-6 flex items-center gap-2">
                        <i data-lucide="calculator" className="text-blue-600"></i>
                        Calculadora de Frequência
                    </h2>
                    
                    <div className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-blue-800 mb-1">Mês</label>
                                <select className="w-full p-2 border border-blue-200 rounded-lg focus:ring-blue-500 focus:border-blue-500 bg-white"
                                    value={mes} onChange={e => setMes(e.target.value)}>
                                    {['Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-blue-800 mb-1">Dias úteis no mês</label>
                                <input type="number" className="w-full p-2 border border-blue-200 rounded-lg bg-white focus:ring-blue-500" 
                                    value={diasUteis} onChange={e => setDiasUteis(Number(e.target.value))} min="1" max="31"/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-blue-800 mb-1">Aulas por dia</label>
                                <input type="number" className="w-full p-2 border border-blue-200 rounded-lg bg-white focus:ring-blue-500" 
                                    value={aulasPorDia} onChange={e => setAulasPorDia(Number(e.target.value))} min="1" max="10"/>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-blue-800 mb-1">Dias s/ aula (Feriados)</label>
                                <input type="number" className="w-full p-2 border border-blue-200 rounded-lg focus:ring-blue-500 bg-white" 
                                    value={diasSemAula} onChange={e => setDiasSemAula(Number(e.target.value))} min="0" max="31"/>
                            </div>
                        </div>

                        <div className="pt-2 border-t border-blue-100">
                            <label className="block text-sm font-bold text-red-600 mb-1">Dias INTEIROS que você faltou</label>
                            <input type="number" className="w-full p-2 border border-red-200 bg-red-50 rounded-lg focus:ring-red-500 focus:border-red-500" 
                                value={faltas} onChange={e => setFaltas(Number(e.target.value))} min="0" max="31"/>
                            <p className="text-xs text-gray-500 mt-1">Ex: Não foi para a escola em 2 dias = coloque 2.</p>
                        </div>

                        <div className="pt-1">
                            <label className="block text-sm font-bold text-orange-600 mb-1">AULAS AVULSAS que você faltou</label>
                            <input type="number" className="w-full p-2 border border-orange-200 bg-orange-50 rounded-lg focus:ring-orange-500 focus:border-orange-500" 
                                value={faltasAulas} onChange={e => setFaltasAulas(Number(e.target.value))} min="0" max="100"/>
                            <p className="text-xs text-gray-500 mt-1">Ex: Foi para a escola, mas matou/perdeu as 2 últimas aulas = coloque 2.</p>
                        </div>

                        <button onClick={calcularFrequencia} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors mt-4 shadow-md">
                            Calcular Frequência
                        </button>

                        {resultado && !resultado.erro && (
                            <div className={`mt-6 p-4 rounded-lg border-2 ${resultado.aprovado ? 'border-blue-400 bg-blue-50' : 'border-red-400 bg-red-50'}`}>
                                <h3 className={`text-xl font-bold text-center ${resultado.aprovado ? 'text-blue-700' : 'text-red-700'}`}>
                                    {resultado.porcentagem}% de Frequência
                                </h3>
                                <p className="text-center text-sm mt-2 font-medium">
                                    {resultado.aprovado ? <span className="text-blue-600">✅ Parabéns! Você está dentro da meta de 80%.</span> : <span className="text-red-600">❌ Cuidado! Você está abaixo dos 80% exigidos.</span>}
                                </p>
                                <div className="mt-3 text-sm text-gray-700 flex justify-between px-4">
                                    <span>Total de aulas: <b>{resultado.totalAulas}</b></span>
                                    <span>Aulas assistidas: <b>{resultado.aulasAssistidas}</b></span>
                                </div>
                            </div>
                        )}
                        {resultado && resultado.erro && (
                            <div className="mt-4 p-3 bg-red-100 text-red-700 rounded-lg border border-red-200">{resultado.erro}</div>
                        )}
                    </div>

                    {/* Links Oficiais */}
                    <div className="mt-8 border-t border-blue-100 pt-6">
                        <h3 className="text-sm font-bold text-blue-900 mb-4 uppercase tracking-wider flex items-center gap-2">
                            <i data-lucide="link" className="w-4 h-4 text-blue-400"></i> Links Úteis & Consultas
                        </h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a href="https://aluno.seduc.ce.gov.br/app/frequencias" target="_blank" rel="noopener noreferrer" 
                               className="flex items-start gap-3 p-3 bg-white rounded-lg border border-blue-100 hover:border-blue-400 hover:shadow-md transition-all group">
                                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                    <i data-lucide="laptop" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p className="font-bold text-blue-900 text-sm">Aluno Online</p>
                                    <p className="text-xs text-gray-500 mt-0.5">Consulte faltas oficiais.</p>
                                </div>
                            </a>
                            <a href="https://www.gov.br/mec/pt-br/pe-de-meia" target="_blank" rel="noopener noreferrer"
                               className="flex items-start gap-3 p-3 bg-white rounded-lg border border-blue-100 hover:border-blue-400 hover:shadow-md transition-all group">
                                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                    <i data-lucide="smartphone" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <p className="font-bold text-blue-900 text-sm">Jornada do Estudante</p>
                                    <p className="text-xs text-gray-500 mt-0.5">App oficial para consultar.</p>
                                </div>
                            </a>
                        </div>
                    </div>
                </Card>
            );
        };

        // --- Aba 2: Assistente IA de Pagamento / Datas ---
        const AssistenteIA = ({ user }) => {
            const [mesAniversario, setMesAniversario] = useState('Janeiro');
            const [mesConsulta, setMesConsulta] = useState('Março');
            const [respostaIA, setRespostaIA] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const consultarIA = async () => {
                setLoading(true);
                setError('');
                setRespostaIA('');

                try {
                    // Chave da API fornecida pelo ambiente (ou vazia para injetar no runtime do sistema gerador)
                    const apiKey = ""; 
                    
                    const promptText = `
                    Você é um assistente virtual focado nas DATAS de pagamento do programa "Pé-de-Meia" do Governo Federal.
                    O aluno (usuário logado no Google) nasceu em ${mesAniversario} e está perguntando quando irá receber a parcela referente ao mês escolar de ${mesConsulta}.
                    
                    Regras importantes:
                    - O pagamento é feito conforme o mês de nascimento do aluno (escalonamento).
                    - Informe que os pagamentos costumam ocorrer no final de cada mês letivo apurado.
                    - Crie uma estimativa e um cronograma amigável de DATAS prováveis.
                    - Formate a resposta em HTML limpo (usando <b>, <ul>, <li>, <br>) para fácil visualização.
                    - Seja direto e encorajador. Assuma que ele cumpriu os 80% de frequência.
                    `;

                    // Usando o modelo suportado no ambiente (flash-preview-09-2025)
                    const endpoint = apiKey 
                        ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`
                        // Fallback temporário caso não tenha key no ambiente web puro:
                        : `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent`; 

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Erro na API (Status: ${response.status}). Nota: A API requer chave de acesso configurada.`);
                    }

                    const data = await response.json();
                    const textoGerado = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (textoGerado) {
                        setRespostaIA(textoGerado);
                    } else {
                        throw new Error("Resposta inválida da Inteligência Artificial.");
                    }

                } catch (err) {
                    console.error(err);
                    // Mock fallback para quando testado fora de um ambiente com API Key válida
                    if (err.message.includes("API requer chave") || err.message.includes("Failed to fetch")) {
                        setTimeout(() => {
                           setRespostaIA(`
                             <b>📅 Estimativa de Datas para o mês letivo de ${mesConsulta}</b><br><br>
                             Para os nascidos em <b>${mesAniversario}</b>, os repasses geralmente seguem o seguinte calendário estimado:<br>
                             <ul>
                               <li>Apuramento das faltas: Até o dia 10 do mês seguinte.</li>
                               <li>Processamento da Caixa: Até o dia 20.</li>
                               <li><b>Data de Pagamento Estimada:</b> Entre os dias 26 e 30.</li>
                             </ul>
                             <br><i>Lembre-se de verificar o aplicativo oficial Caixa Tem ou Jornada do Estudante para a data exata oficializada.</i>
                           `);
                           setLoading(false);
                        }, 1500);
                    } else {
                        setError(err.message || "Ocorreu um erro ao consultar as datas. Tente novamente.");
                        setLoading(false);
                    }
                }
            };

            if (!user) {
                return (
                    <Card className="max-w-xl mx-auto text-center py-10">
                        <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="calendar-search" size="32"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-blue-900 mb-2">Consulta de Datas com IA</h2>
                        <p className="text-gray-600 mb-6">Para usar a Inteligência Artificial que calcula e pesquisa as datas exatas do seu pagamento, faça login com segurança usando sua conta do Google.</p>
                        
                        <div className="bg-blue-50 border border-blue-100 p-4 rounded-lg mb-6 text-sm text-blue-800 text-left">
                            <p className="font-bold flex items-center gap-1 mb-1"><i data-lucide="info" className="w-4 h-4"></i> Atenção e Privacidade</p>
                            <p>Ao fazer login via Google, você concorda com nossos Termos de Políticas e Privacidade. Não armazenamos senhas, utilizamos o serviço oficial do Google apenas para liberar acesso à pesquisa inteligente de datas.</p>
                        </div>

                        <button onClick={window.loginGoogle} className="bg-white border-2 border-blue-200 text-blue-800 hover:bg-blue-50 font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center mx-auto gap-3 w-full sm:w-auto">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-5 h-5" alt="Google" />
                            Fazer Login para Consultar
                        </button>
                    </Card>
                );
            }

            return (
                <Card className="max-w-xl mx-auto">
                    <div className="flex justify-between items-start mb-6 border-b border-blue-100 pb-4">
                        <h2 className="text-2xl font-bold text-blue-900 flex items-center gap-2">
                            <i data-lucide="calendar-search" className="text-blue-500"></i>
                            Datas do Pagamento
                        </h2>
                    </div>

                    <div className="space-y-4 mb-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-blue-800 mb-1">Seu Mês de Nascimento</label>
                                <select className="w-full p-2 border border-blue-200 bg-white rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                    value={mesAniversario} onChange={e => setMesAniversario(e.target.value)}>
                                    {['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-blue-800 mb-1">Mês letivo da parcela</label>
                                <select className="w-full p-2 border border-blue-200 bg-white rounded-lg focus:ring-blue-500 focus:border-blue-500"
                                    value={mesConsulta} onChange={e => setMesConsulta(e.target.value)}>
                                    {['Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro'].map(m => (
                                        <option key={m} value={m}>{m}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <button 
                            onClick={consultarIA} 
                            disabled={loading}
                            className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-400 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2 shadow-md">
                            {loading ? <div className="loader border-t-white w-6 h-6 border-2"></div> : 'Pesquisar Datas com IA'}
                        </button>
                    </div>

                    {error && (
                        <div className="p-4 bg-red-50 text-red-700 rounded-lg border border-red-200 text-sm">
                            <i data-lucide="alert-circle" className="inline mr-2 w-4 h-4"></i>
                            {error}
                        </div>
                    )}

                    {respostaIA && (
                        <div className="mt-4 p-5 bg-white rounded-lg border-2 border-blue-200 shadow-inner">
                            <h3 className="font-bold text-blue-900 mb-3 flex items-center gap-2">
                                <i data-lucide="bot" className="w-5 h-5 text-blue-600"></i> Resposta da IA:
                            </h3>
                            <div className="text-gray-700 text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: respostaIA.replace(/```html/g, '').replace(/```/g, '') }} />
                        </div>
                    )}
                </Card>
            );
        };

        // --- Aba 3: Extras (Simulador) ---
        const ExtrasApp = () => {
            const [meses, setMeses] = useState(10);
            const valorMensal = 200; 
            const valorConclusao = 1000; 

            const totalMensalidades = meses * valorMensal;
            const anosConcluidos = Math.floor(meses / 10); 
            const totalBonus = anosConcluidos * valorConclusao;
            const totalGeral = totalMensalidades + totalBonus;

            return (
                <Card className="max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-blue-900 mb-2 flex items-center gap-2">
                        <i data-lucide="piggy-bank" className="text-blue-500"></i>
                        Simulador Poupança
                    </h2>
                    <p className="text-gray-600 text-sm mb-6">Veja quanto você pode acumular mantendo sua frequência perfeita no Ensino Médio.</p>

                    <div className="mb-6">
                        <label className="block text-sm font-medium text-blue-800 mb-2">Meses de repasse recebidos</label>
                        <input type="range" min="1" max="30" value={meses} onChange={e => setMeses(Number(e.target.value))} className="w-full h-2 bg-blue-100 rounded-lg appearance-none cursor-pointer accent-blue-600"/>
                        <div className="text-center mt-2 font-bold text-blue-900">{meses} meses ({Math.floor(meses/10)} anos completos)</div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 text-center">
                        <div className="p-4 bg-white rounded-lg border border-blue-100 shadow-sm">
                            <p className="text-xs text-gray-500 uppercase tracking-wide">Mensalidades (R$ 200)</p>
                            <p className="text-xl font-bold text-blue-800 mt-1">R$ {totalMensalidades.toLocaleString('pt-BR')}</p>
                        </div>
                        <div className="p-4 bg-white rounded-lg border border-blue-100 shadow-sm">
                            <p className="text-xs text-gray-500 uppercase tracking-wide">Bônus Anual (R$ 1000)</p>
                            <p className="text-xl font-bold text-blue-800 mt-1">R$ {totalBonus.toLocaleString('pt-BR')}</p>
                        </div>
                    </div>

                    <div className="mt-4 p-5 bg-blue-600 rounded-lg text-white text-center shadow-md">
                        <p className="text-sm font-medium opacity-90 uppercase tracking-wider mb-1">Total Acumulado Estimado</p>
                        <h3 className="text-4xl font-extrabold">R$ {totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</h3>
                    </div>
                </Card>
            );
        };

        // --- Aba 4: Dúvidas ---
        const DuvidasApp = () => {
            const faqData = [
                {
                    q: "Quem tem direito ao Pé-de-Meia?",
                    a: "Estudantes matriculados no ensino médio das redes públicas, com idade entre 15 e 24 anos, cujas famílias estejam inscritas no Cadastro Único (CadÚnico)."
                },
                {
                    q: "Como o dinheiro é pago?",
                    a: "Os valores são depositados em uma conta aberta automaticamente pela Caixa Econômica Federal em nome do estudante (pode ser movimentada pelo aplicativo Caixa Tem)."
                },
                {
                    q: "Quais são as exigências para não perder?",
                    a: "Frequência escolar mínima de 80%, aprovação ao final do ano, e participação em exames como o SAEB e o ENEM."
                },
                {
                    q: "Se eu tiver faltas justificadas com atestado, elas contam?",
                    a: "Faltas justificadas com atestado médico entregue e validado pela escola não devem descontar na sua porcentagem, pois são abonadas pelo sistema escolar oficial."
                }
            ];

            return (
                <Card className="max-w-xl mx-auto">
                    <h2 className="text-2xl font-bold text-blue-900 mb-6 flex items-center gap-2">
                        <i data-lucide="help-circle" className="text-blue-500"></i>
                        Dúvidas Frequentes
                    </h2>
                    
                    <div className="space-y-4">
                        {faqData.map((item, idx) => (
                            <div key={idx} className="bg-white p-4 rounded-lg border border-blue-100 shadow-sm">
                                <h3 className="font-bold text-blue-800 mb-2">{item.q}</h3>
                                <p className="text-gray-600 text-sm">{item.a}</p>
                            </div>
                        ))}
                    </div>
                </Card>
            );
        };

        // --- App Principal ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoaded, setAuthLoaded] = useState(false);
            const [activeTab, setActiveTab] = useState('frequencia');
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isStandalone, setIsStandalone] = useState(false);

            useEffect(() => {
                // Verificar PWA Standalone
                if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                    setIsStandalone(true);
                }

                // Capturar evento de instalação PWA
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                });

                // Inicializar Firebase e Auth
                const checkFirebase = setInterval(() => {
                    if (window.firebaseApp) {
                        clearInterval(checkFirebase);
                        
                        window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (currentUser) => {
                            setUser(currentUser);
                            setAuthLoaded(true);
                        });

                        window.loginGoogle = async () => {
                            try {
                                const provider = new window.firebaseApp.GoogleAuthProvider();
                                await window.firebaseApp.signInWithPopup(window.firebaseApp.auth, provider);
                            } catch (error) {
                                console.error("Erro no login", error);
                                alert("Erro ao fazer login com Google.");
                            }
                        };

                        window.logout = async () => {
                            await window.firebaseApp.signOut(window.firebaseApp.auth);
                        };
                    }
                }, 100);

                return () => clearInterval(checkFirebase);
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const handleInstallClick = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                    }
                }
            };

            if (!authLoaded) return <div className="min-h-screen flex items-center justify-center"><div className="loader"></div></div>;

            return (
                <div className="min-h-screen pb-20 flex flex-col">
                    {/* Header Padrão Azul */}
                    <header className="bg-blue-700 text-white shadow-md">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i data-lucide="graduation-cap" className="w-7 h-7"></i>
                                <h1 className="text-lg font-bold tracking-tight">Hub Pé-de-Meia</h1>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                {/* Botão PWA (só aparece se puder instalar e não for standalone) */}
                                {deferredPrompt && !isStandalone && (
                                    <button onClick={handleInstallClick} className="hidden sm:flex items-center gap-1 text-xs bg-white text-blue-700 font-bold px-3 py-1.5 rounded-full hover:bg-blue-50 transition">
                                        <i data-lucide="download" className="w-3 h-3"></i> Instalar App
                                    </button>
                                )}

                                {/* Perfil de Usuário */}
                                {user ? (
                                    <div className="flex items-center gap-3">
                                        <div className="hidden sm:block text-right">
                                            <p className="text-[10px] text-blue-200 uppercase tracking-widest font-bold">Bem-vindo(a)</p>
                                            <p className="text-sm font-bold truncate max-w-[120px]">{user.displayName.split(' ')[0]}</p>
                                        </div>
                                        <img src={user.photoURL} referrerPolicy="no-referrer" alt="Avatar" className="w-9 h-9 rounded-full border-2 border-blue-400 shadow-sm" />
                                        <button onClick={window.logout} title="Sair" className="text-white hover:text-blue-200 bg-blue-800 p-2 rounded-full transition ml-1">
                                            <i data-lucide="log-out" className="w-4 h-4"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button onClick={window.loginGoogle} className="text-sm bg-white text-blue-700 font-bold hover:bg-blue-50 px-5 py-2 rounded-full transition shadow-sm">
                                        Entrar
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Navegação Tabs */}
                    <div className="max-w-4xl mx-auto px-4 mt-6 mb-8 w-full">
                        <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                            <button onClick={() => setActiveTab('frequencia')} 
                                className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold whitespace-nowrap transition-all text-sm ${activeTab === 'frequencia' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-600 hover:bg-blue-50 border border-blue-200'}`}>
                                <i data-lucide="calculator" className="w-4 h-4"></i> Frequência
                            </button>
                            <button onClick={() => setActiveTab('pagamento')} 
                                className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold whitespace-nowrap transition-all text-sm ${activeTab === 'pagamento' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-600 hover:bg-blue-50 border border-blue-200'}`}>
                                <i data-lucide="calendar-search" className="w-4 h-4"></i> Datas IA
                            </button>
                            <button onClick={() => setActiveTab('extras')} 
                                className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold whitespace-nowrap transition-all text-sm ${activeTab === 'extras' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-600 hover:bg-blue-50 border border-blue-200'}`}>
                                <i data-lucide="piggy-bank" className="w-4 h-4"></i> Simulador
                            </button>
                            <button onClick={() => setActiveTab('duvidas')} 
                                className={`flex items-center gap-2 px-5 py-2.5 rounded-full font-bold whitespace-nowrap transition-all text-sm ${activeTab === 'duvidas' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-blue-600 hover:bg-blue-50 border border-blue-200'}`}>
                                <i data-lucide="help-circle" className="w-4 h-4"></i> Dúvidas
                            </button>
                        </div>
                    </div>

                    {/* Área de Conteúdo */}
                    <main className="max-w-4xl mx-auto px-4 flex-grow w-full">
                        {activeTab === 'frequencia' && <FrequenciaApp />}
                        {activeTab === 'pagamento' && <AssistenteIA user={user} />}
                        {activeTab === 'extras' && <ExtrasApp />}
                        {activeTab === 'duvidas' && <DuvidasApp />}
                    </main>

                    {/* Rodapé Obrigatório */}
                    <footer className="mt-auto bg-white border-t border-gray-200 py-4 px-4 w-full text-center">
                        <div className="max-w-3xl mx-auto">
                            <p className="text-xs text-gray-500 font-bold flex items-center justify-center gap-1.5 flex-wrap">
                                ⚠️ ATENÇÃO: Ferramenta INDEPENDENTE. Não é um aplicativo oficial do Governo, MEC ou Caixa.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
